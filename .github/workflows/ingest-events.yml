name: Ingest events
on:
  schedule:
    - cron: '17 13 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview saved extraction with zero paid requests
        type: boolean
        default: true
      account:
        description: Optional Instagram handle; leave empty for all sources
        type: string
        default: ''
      retry_failed:
        description: Retry saved failed/held posts without recollecting (turn dry_run off)
        type: boolean
        default: false
      refresh_media:
        description: Fetch fresh Instagram media now for one account (set account; turn dry_run and retry_failed off)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: event-ingestion-production
  cancel-in-progress: false
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      INGEST_ACCOUNT: ${{ inputs.account || '' }}
      INGEST_DRY_RUN: ${{ inputs.dry_run || false }}
      INGEST_RETRY: ${{ inputs.retry_failed || false }}
      INGEST_REFRESH_MEDIA: ${{ inputs.refresh_media || false }}
      APIFY_MAX_RUN_USD: ${{ vars.APIFY_MAX_RUN_USD || '0.50' }}
      APIFY_MAX_MONTH_USD: ${{ vars.APIFY_MAX_MONTH_USD || '15' }}
      EVENT_IMAGES_BUCKET: event-images
      OPENAI_EXTRACTION_MODEL: ${{ vars.OPENAI_EXTRACTION_MODEL || 'gpt-4o-mini' }}
      GEOCODING_BASE_URL: ${{ vars.GEOCODING_BASE_URL || 'https://nominatim.openstreetmap.org/' }}
      GEOCODING_USER_AGENT: ${{ vars.GEOCODING_USER_AGENT || 'Project-Hermes-Events/0.1 (Waterloo event discovery)' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check worker configuration
        shell: bash
        run: |
          if [ "$INGEST_REFRESH_MEDIA" = "true" ] && { [ -z "$INGEST_ACCOUNT" ] || [ "$INGEST_DRY_RUN" = "true" ] || [ "$INGEST_RETRY" = "true" ]; }; then
            echo "::error::Media refresh requires one account, dry_run off, and retry_failed off."
            exit 1
          fi
          names=(DATABASE_URL)
          if [ "$INGEST_DRY_RUN" != "true" ]; then
            names+=(OPENAI_API_KEY NEXT_PUBLIC_SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY)
            if [ "$INGEST_RETRY" != "true" ]; then names+=(APIFY_TOKEN); fi
          fi
          for name in "${names[@]}"; do
            if [ -z "${!name}" ]; then echo "::error::Missing worker configuration: $name"; exit 1; fi
          done
      - name: Run ingestion
        shell: bash
        run: |
          args=()
          if [ "$INGEST_DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          if [ "$INGEST_RETRY" = "true" ]; then args+=(--retry); fi
          if [ "$INGEST_REFRESH_MEDIA" = "true" ]; then args+=(--refresh-media); fi
          if [ -n "$INGEST_ACCOUNT" ]; then args+=(--account "$INGEST_ACCOUNT"); fi
          npm run ingest:events -- "${args[@]}"
